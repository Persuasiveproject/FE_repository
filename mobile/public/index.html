<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: 아이폰 홈 표시줄·노치 영역 값(env(safe-area-inset-*))을 쓰기 위해 필요 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="영업중" />
    <title>영업중</title>
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; background-color: #FFFFFF; }
      /* 모바일 브라우저 주소창이 접혔다 펴져도 하단 탭이 가려지지 않게 실제 보이는 높이(dvh)를 쓴다 */
      #root { display: flex; height: 100%; height: 100dvh; flex: 1; }
    </style>
  </head>
  <body>
    <noscript>영업중을 이용하려면 JavaScript를 켜 주세요.</noscript>
    <div id="root"></div>
  </body>
</html>
